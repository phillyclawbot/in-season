<title>Shared Grocery List</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app. Fixed header and tabs, a scrolling list grouped by aisle,
   and the add bar pinned to the bottom. Sale prices wear a yellow flyer price tag. */
:root {
  --bg: #F2F6F0; --surface: #FFFFFF; --ink: #15231A; --muted: #56675B; --faint: #8A9B8F;
  --line: #DBE4DA; --chip: #E6EEE4; --brand: #1E6A39; --brand-ink: #FFFFFF;
  --tag: #FFD84A; --tag-ink: #33260A; --danger: #B3261E; --ok: #1E8E4A; --shade: rgba(21,35,26,.45);
  --display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1511; --surface: #17211B; --ink: #E7F0E8; --muted: #A2B3A6; --faint: #74867A;
  --line: #27342C; --chip: #1F2B24; --brand: #5CC784; --brand-ink: #06230F;
  --tag: #F2C933; --tag-ink: #2A1E00; --danger: #FF8A80; --ok: #5CC784; --shade: rgba(0,0,0,.6); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1511; --surface: #17211B; --ink: #E7F0E8; --muted: #A2B3A6; --faint: #74867A;
  --line: #27342C; --chip: #1F2B24; --brand: #5CC784; --brand-ink: #06230F;
  --tag: #F2C933; --tag-ink: #2A1E00; --danger: #FF8A80; --ok: #5CC784; --shade: rgba(0,0,0,.6); color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.4;
  display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input, textarea { font: inherit; color: var(--ink); }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.band { padding-left: var(--gl); padding-right: var(--gr); width: 100%; max-width: 640px; margin: 0 auto; }

/* Header */
.head { padding-block: 14px 6px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.head h1 { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.05; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; font-weight: 500; margin-top: 3px; }
.head-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; padding-top: 4px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: block; }
.status.live i { background: var(--ok); }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; background: var(--chip); display: grid; place-items: center; }
.iconbtn svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.note { margin-block: 4px 6px; padding: 9px 12px; border-radius: 12px; background: var(--chip); color: var(--muted); font-size: 12.5px; font-weight: 500; }

/* Tabs */
.tabs { display: flex; gap: 6px; padding-block: 6px 8px; }
.tab { flex: 1; text-align: center; padding: 9px 10px; border-radius: 12px; font-weight: 700; font-size: 13px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }

/* Scrolling body */
main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.body { padding-block: 4px 20px; display: flex; flex-direction: column; gap: 16px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 2px 6px; }
.sec-head h2 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sec-head h2 span { color: var(--faint); font-weight: 600; letter-spacing: 0; }
.sec-head h2.store { font-family: var(--display); font-size: 17px; font-weight: 800; letter-spacing: 0; text-transform: none; color: var(--ink); }
.pill { font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: var(--chip); color: var(--ink); }
.pill.warn { background: var(--danger); color: var(--surface); }
.card { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.card > li + li { border-top: 1px solid var(--line); }
.row { display: flex; align-items: stretch; }
.check { padding: 0 10px 0 14px; display: grid; place-items: center; }
.check i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--faint); display: grid; place-items: center; }
.check[aria-pressed="true"] i { background: var(--brand); border-color: var(--brand); }
.check svg { width: 13px; height: 13px; stroke: var(--brand-ink); fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.check[aria-pressed="true"] svg { opacity: 1; }
.rowmain { flex: 1; min-width: 0; padding: 12px 12px 12px 2px; display: flex; flex-direction: column; gap: 5px; }
.line1 { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.name { font-weight: 600; font-size: 15.5px; overflow-wrap: anywhere; }
.qty { color: var(--muted); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.done .name { text-decoration: line-through; color: var(--faint); font-weight: 500; }
.deal { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tag { background: var(--tag); color: var(--tag-ink); font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums;
  padding: 2px 8px 2px 14px; clip-path: polygon(9px 0, 100% 0, 100% 100%, 9px 100%, 0 50%); white-space: nowrap; }
.where { color: var(--muted); font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.by { align-self: center; margin-right: 12px; width: 24px; height: 24px; border-radius: 50%; background: var(--chip); color: var(--muted);
  font-size: 11px; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; }
.by:empty { display: none; }
.dealrow { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
.dealrow .txt { flex: 1; min-width: 0; }
.dealrow .small { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.dealrow .right { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.thru { color: var(--faint); font-size: 11px; font-weight: 500; }

/* Empty states */
.empty { padding: 36px 8px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty h2 { font-family: var(--display); font-size: 21px; font-weight: 800; margin: 0; text-wrap: balance; }
.empty p { margin: 0; color: var(--muted); max-width: 34ch; }
.quick { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
.quick button { padding: 8px 13px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 13.5px; }
.btn { display: inline-block; text-align: center; padding: 12px 18px; border-radius: 14px; background: var(--brand); color: var(--brand-ink); font-weight: 700; }
.btn.quiet { background: var(--chip); color: var(--ink); }
.btn.block { display: block; width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }

/* Add bar */
.addbar { border-top: 1px solid var(--line); background: var(--bg); }
.addbar form { display: flex; gap: 8px; padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
.field { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); font-size: 16px; }
.field::placeholder { color: var(--faint); }
.addbtn { width: 48px; height: 48px; border-radius: 14px; background: var(--brand); color: var(--brand-ink); font-size: 24px; font-weight: 600; display: grid; place-items: center; flex-shrink: 0; }
.addbtn:disabled { opacity: .45; }

/* Sheets */
.scrim { position: fixed; inset: 0; background: var(--shade); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--bg); border-radius: 22px 22px 0 0; max-height: 88%;
  display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px 8px; }
.sheet-head h2 { font-family: var(--display); font-size: 20px; font-weight: 800; margin: 0; overflow-wrap: anywhere; }
.sheet-body { overflow-y: auto; padding-block: 4px 18px; display: flex; flex-direction: column; gap: 18px; }
.group { display: flex; flex-direction: column; gap: 7px; }
.label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.two { display: flex; gap: 8px; }
.two .field:last-child { flex: 0 0 96px; text-align: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { padding: 7px 12px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--line); font-weight: 600; font-size: 13px; color: var(--muted); }
.chips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.storerow { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.storerow .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--faint); display: grid; place-items: center; flex-shrink: 0; }
.storerow[aria-pressed="true"] .box { background: var(--brand); border-color: var(--brand); }
.storerow .box svg { width: 12px; height: 12px; stroke: var(--brand-ink); fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.storerow[aria-pressed="true"] .box svg { opacity: 1; }
.storerow .nm { flex: 1; font-weight: 600; }
.storerow .ct { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
textarea.field { min-height: 170px; resize: vertical; width: 100%; line-height: 1.45; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
label.btn { cursor: pointer; }
label.btn[aria-disabled="true"] { opacity: .5; cursor: default; }
.danger { color: var(--danger); font-weight: 700; font-size: 13.5px; padding: 8px 2px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 13.5px; max-width: calc(100% - 32px); text-align: center; }
</style>

<header class="band head">
  <div>
    <h1>Grocery list</h1>
    <div class="sub" id="sub">Loading your list…</div>
  </div>
  <div class="head-right">
    <span class="status" id="status"><i></i><span>Connecting</span></span>
    <button class="iconbtn" data-act="settings" aria-label="Stores and settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </div>
</header>
<div class="band" id="notes"></div>
<nav class="band tabs" role="tablist">
  <button class="tab" role="tab" data-act="view" data-view="list" aria-selected="true" id="tab-list">List</button>
  <button class="tab" role="tab" data-act="view" data-view="deals" aria-selected="false" id="tab-deals">Deals</button>
</nav>
<main id="main"><div class="band body" id="body"></div></main>
<div class="addbar" id="addbar">
  <form class="band" id="addform" autocomplete="off">
    <input class="field" id="add-input" placeholder="Add: 2 lb chicken thighs, milk" enterkeyhint="done" autocapitalize="none" aria-label="Add items">
    <button class="addbtn" id="add-btn" aria-label="Add to list">+</button>
  </form>
</div>
<div class="scrim" id="scrim" data-act="close" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
"use strict";

/* ---------- Aisles, parsing, matching (pure functions) ---------- */
var AISLES = ["Produce","Bakery","Deli","Meat & Seafood","Dairy & Eggs","Frozen","Pantry","Snacks","Beverages","Household","Personal Care","Baby & Pets","Other"];
var KEYWORDS = /*__KEYWORDS__*/{};
var ENTRIES = [];
Object.keys(KEYWORDS).forEach(function (c) { KEYWORDS[c].forEach(function (k) { ENTRIES.push([k, c]); }); });
ENTRIES.sort(function (a, b) { return b[0].length - a[0].length; });

function norm(s) { return String(s).toLowerCase().replace(/[^\p{L}\p{N}&%\s-]/gu, " ").replace(/\s+/g, " ").trim(); }
function aisleFor(name) {
  var text = " " + norm(name) + " ";
  if (!text.trim()) return "Other";
  for (var i = 0; i < ENTRIES.length; i++) if (text.indexOf(" " + ENTRIES[i][0] + " ") !== -1) return ENTRIES[i][1];
  var words = text.trim().split(" ");
  for (var w = 0; w < words.length; w++) {
    var word = words[w], vs = [word];
    if (/ies$/.test(word)) vs.push(word.slice(0, -3) + "y");
    if (/es$/.test(word)) vs.push(word.slice(0, -2));
    if (/s$/.test(word)) vs.push(word.slice(0, -1));
    for (var v = 0; v < vs.length; v++) for (var e = 0; e < ENTRIES.length; e++) if (ENTRIES[e][0] === vs[v]) return ENTRIES[e][1];
  }
  return "Other";
}

var UNITS = "lb|lbs|pound|pounds|oz|ounce|ounces|kg|g|gram|grams|l|liter|liters|litre|litres|ml|gal|gallon|gallons|qt|quart|quarts|pt|pint|pints|cup|cups|pack|packs|pk|bag|bags|box|boxes|can|cans|jar|jars|bottle|bottles|bunch|bunches|head|heads|dozen|doz|case|cases|loaf|loaves|carton|cartons|container|containers|roll|rolls|stick|sticks|bar|bars|each|ea|ct|count|pcs|pieces|piece|x";
var NUM = "(?:\\d+(?:[.,]\\d+)?|\\d+\\s*/\\s*\\d+|\\d+\\s+\\d+/\\d+|½|¼|¾)";
var LEADING = new RegExp("^(" + NUM + ")\\s*(" + UNITS + ")?\\.?\\s+(?:of\\s+)?(.+)$", "i");
var TRAILING = new RegExp("^(.+?)\\s*(?:x\\s*|\\(|-\\s*)(" + NUM + ")\\s*(" + UNITS + ")?\\)?\\s*$", "i");
var WORDQ = new RegExp("^(?:a|an|one)?\\s*(" + UNITS + ")\\s+(?:of\\s+)?(.+)$", "i");
function tidy(s) { return s.replace(/^[\s,.\-–—]+|[\s,.\-–—]+$/g, "").trim(); }
function joinQty(n, u) { n = n.replace(/\s+/g, " ").trim(); return (!u || u.toLowerCase() === "x") ? n : n + " " + u.toLowerCase(); }
function parseItem(raw) {
  var t = String(raw).trim().replace(/\s+/g, " "), m;
  if (!t) return { name: "", qty: "" };
  if ((m = t.match(LEADING))) return { qty: joinQty(m[1], m[2]), name: tidy(m[3]) };
  if ((m = t.match(TRAILING))) return { qty: joinQty(m[2], m[3]), name: tidy(m[1]) };
  if ((m = t.match(WORDQ))) { var u = m[1].toLowerCase(); return { qty: (u === "dozen" || u === "doz") ? "12" : "1 " + u, name: tidy(m[2]) }; }
  return { qty: "", name: tidy(t) };
}
function splitTyped(raw) { return String(raw).split(/\s*(?:[;\n]|,(?!\d))\s*/).map(function (s) { return s.trim(); }).filter(Boolean); }
/* Pasted lists (Reminders, Notes, texts): one item per line, bullets and checkboxes stripped. */
function splitPasted(raw) {
  var lines = String(raw).split(/\r?\n/).map(function (l) {
    return l.replace(/^[\s•◦▪○●□▢◯☐☑☒✓✔·*\-–—]+/, "")
            .replace(/^\[[ xX]?\]\s*/, "").replace(/^\d{1,2}[.)]\s+/, "").trim();
  }).filter(Boolean);
  if (lines.length === 1) return splitTyped(lines[0]);
  return lines;
}

var STOP = { of:1, the:1, a:1, an:1, and:1, or:1, fresh:1, organic:1, large:1, small:1, medium:1 };
var TYPEWORDS = {};
"pudding chips chip bread muffin muffins cake cakes pie pies juice soup soups sauce flavored flavor cereal bar bars yogurt smoothie candy cookie cookies cracker crackers dip dressing seasoning mix powder extract syrup jam jelly spread noodle noodles pasta salad soda drink drinks tea coffee gum snack snacks filling frosting nuggets patties sausage broth stock bouillon wrap wraps sandwich sandwiches pizza burrito burritos ice cream popsicle popsicles sorbet gelato lotion shampoo scent scented candle candles food treats litter toy toys fries dried canned roasted fried breaded stuffed seeds oil vinegar wine beer liqueur vodka rum".split(" ").forEach(function (w) { TYPEWORDS[w] = 1; });
function stem(w) { if (/ies$/.test(w)) return w.slice(0, -3) + "y"; if (/es$/.test(w) && w.length > 4) return w.slice(0, -2); if (/s$/.test(w) && w.length > 3) return w.slice(0, -1); return w; }
function wordsOf(s) { return String(s).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, " ").split(/\s+/).filter(Boolean); }
function queryTokens(name) { return wordsOf(name).filter(function (w) { return w.length > 1 && !STOP[w]; }); }
/* A flyer item matches when it mentions every word of the list item and isn't a different product made from it. */
function matches(entry, tokens) {
  if (!tokens.length) return false;
  var asked = {};
  for (var i = 0; i < tokens.length; i++) {
    var t = tokens[i], s = stem(t); asked[s] = 1;
    var ok = entry.lc.indexOf(t) !== -1;
    if (!ok) for (var j = 0; j < entry.st.length; j++) if (entry.st[j] === s || entry.st[j].indexOf(s) === 0) { ok = true; break; }
    if (!ok) return false;
  }
  for (var k = 0; k < entry.w.length; k++) if (TYPEWORDS[entry.w[k]] && !asked[stem(entry.w[k])]) return false;
  return true;
}
function money(p, u) { return "$" + Number(p).toFixed(2) + (u ? " " + u : ""); }
function shortDate(iso) { if (!iso) return ""; var d = new Date(iso.length === 10 ? iso + "T12:00:00" : iso); return isNaN(d) ? "" : d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }

/* ---------- State ---------- */
var S = {
  mode: "loading",          // loading | db | local
  items: [], settings: { storeIds: [], zip: "" },
  flyerDocs: [], catalog: [], catVer: 0,
  view: "list", sheet: null, sheetItemId: null,
  loaded: false, slow: false, canWrite: true, wroteOnce: false, confirmClear: false, storeErr: null
};
var db = null, user = null, myId = null, dealCache = {}, clearTimer = null, toastTimer = null;
var sampler = null, imgLimits = null, reading = false;
var PHOTO_PROMPT = "The attached images are screenshots or photos of a shopping list or to-do list, for example from the Apple Reminders app or a handwritten note. " +
  "Reply with only a JSON array of strings, one string per list item, in the order shown. Copy each item's text as written, including any amount. " +
  "Leave out items that are visibly checked off or struck through, and leave out headings, list titles, dates, times, buttons and other interface text. " +
  "If the same item appears in two images, include it once. If there are no list items, reply []. Example: [\"Milk\", \"2 lb chicken thighs\"]";
var $ = function (id) { return document.getElementById(id); };
var CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- Deals ---------- */
function buildCatalog() {
  var out = [];
  S.flyerDocs.forEach(function (d) {
    (d.items || []).forEach(function (it) {
      var w = wordsOf(it.n);
      out.push({ n: it.n, p: it.p, u: String(it.u || "").toLowerCase().replace(/\.+$/, ""), s: it.s || "", t: it.t || "", sid: d.storeId, store: d.store, lc: String(it.n).toLowerCase(), w: w, st: w.map(stem), a: aisleFor(it.n) });
    });
  });
  S.catalog = out; S.catVer++; dealCache = {};
}
function storeKey() { return (S.settings.storeIds || []).slice().sort().join(","); }
function dealsFor(item) {
  if (!S.catalog.length) return [];
  var key = norm(item.name) + "|" + storeKey();
  if (dealCache[key]) return dealCache[key];
  /* The flyer item must also belong in the same aisle as the list item, so "milk"
     does not pull in evaporated milk and "bread" does not pull in bread crumbs. */
  var tokens = queryTokens(item.name), now = today(), picked = S.settings.storeIds || [], res = [], aisle = aisleFor(item.name);
  for (var i = 0; i < S.catalog.length; i++) {
    var e = S.catalog[i];
    if (picked.length && picked.indexOf(e.sid) === -1) continue;
    if (e.t && e.t < now) continue;
    if (aisle !== "Other" && e.a !== "Other" && e.a !== aisle) continue;
    if (matches(e, tokens)) res.push(e);
  }
  res.sort(function (a, b) { return a.p - b.p; });
  return (dealCache[key] = res);
}
function storeList() {
  var map = {};
  S.flyerDocs.forEach(function (d) { var m = map[d.storeId] || (map[d.storeId] = { id: d.storeId, name: d.store, count: 0 }); m.count += (d.items || []).length; });
